<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación de Pedido Clark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>

  <div class="shell">

    <!-- Pantalla de acceso -->
    <div id="loginScreen" class="screen active">
      <div class="brand">
        <div class="mark">C</div>
        <h1>Confirmación de Pedido</h1>
        <p class="sub">Cliente Clark · Trazabilidad en depósito</p>
      </div>

      <div class="qr-box">
        <div id="qrcode"></div>
        <p>Escaneá este código desde tu celular para acceder directamente al panel de registro.</p>
      </div>

      <div class="field">
        <label for="userName">Nombre completo</label>
        <input type="text" id="userName" placeholder="Ej: Marcos Rivero" autocomplete="name">
      </div>
      <button class="btn btn-primary" onclick="login()">Ingresar</button>
    </div>

    <!-- Panel principal -->
    <div id="mainPanel" class="screen">
      <div class="panel-header">
        <div class="user-chip">
          <div class="dot" id="userInitial">–</div>
          <div class="who">
            <strong id="displayUserName">Usuario</strong>
            <span>Operador de depósito</span>
          </div>
        </div>
        <button class="btn btn-ghost" onclick="logout()">Salir</button>
      </div>

      <span class="client-tag">● CLIENTE — CLARK</span>

      <div class="notice-banner hidden" id="syncNotice">
        <span>ⓘ</span>
        <span id="syncNoticeText"></span>
      </div>

      <h2 class="section-title">Nuevo registro</h2>
      <form id="orderForm" onsubmit="confirmOrder(event)">
        <div class="field">
          <label for="orderNumber">Número de pedido</label>
          <input type="text" id="orderNumber" placeholder="PED-2026-001" required autocomplete="off">
        </div>

        <div class="field-row">
          <div class="field">
            <label for="location">Ubicación</label>
            <select id="location" required>
              <option value="">Elegir…</option>
              <option value="NAVE1 A">NAVE1 A</option>
              <option value="NAVE1 B">NAVE1 B</option>
              <option value="NAVE2 A">NAVE2 A</option>
              <option value="NAVE2 B">NAVE2 B</option>
              <option value="ALERO1">ALERO1</option>
              <option value="ALERO2">ALERO2</option>
            </select>
          </div>
          <div class="field">
            <label for="palletCount">Pallets</label>
            <input type="number" id="palletCount" min="1" max="100" required inputmode="numeric">
          </div>
        </div>

        <div class="field">
          <label for="orderStatus">Estado</label>
          <select id="orderStatus" required>
            <option value="">Elegir…</option>
            <option value="Preparado">Preparado</option>
            <option value="Controlado">Controlado</option>
            <option value="Listo para despacho">Listo para despacho</option>
            <option value="Despachado">Despachado</option>
          </select>
        </div>

        <div class="field">
          <label for="observations">Observaciones (opcional)</label>
          <textarea id="observations" placeholder="Detalles adicionales…"></textarea>
        </div>
      </form>

      <div class="history-section">
        <h2 class="section-title">Historial reciente</h2>
        <div id="historyList" class="history-list"></div>
      </div>
    </div>

  </div>

  <div class="action-bar" id="actionBar" style="display:none;">
    <div class="action-bar-inner">
      <button type="submit" form="orderForm" class="btn btn-primary" id="submitBtn">Confirmar pedido</button>
    </div>
  </div>

  <!-- Confirmación -->
  <div id="confirmationModal" class="modal-veil">
    <div class="modal-card">
      <div class="icon">✓</div>
      <h2>Pedido confirmado</h2>
      <div id="confirmationDetails" class="receipt"></div>
      <button class="btn btn-primary" onclick="closeModal()">Cerrar</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
